name: Mantener Supabase activa

# El plan gratuito de Supabase pausa el proyecto cuando ve "poca actividad"
# en los ultimos 7 dias. La documentacion pide "unas cuantas consultas cada
# dia": una sola consulta diaria NO alcanzo (se pauso el 26-oct-2026).
#
# Ahora corre 4 veces al dia y hace 5 consultas en cada corrida (~20/dia).
#
# Llama a hay_acceso(), que solo responde si existe una clave de dueno
# (true/false). No expone datos: las tablas siguen protegidas por RLS.
# La apikey es la misma clave publica "anon" que ya viaja en app.js.
#
# OJO: GitHub desactiva los flujos programados tras 60 dias sin actividad en
# el repositorio. Si eso pasa, reactivalo desde la pestana Actions.

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'   # cada 6 horas (20:17, 02:17, 08:17, 14:17 en Ecuador)
  workflow_dispatch:                # tambien se puede ejecutar a mano desde Actions

concurrency:
  group: mantener-activa
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar la base de datos
        env:
          PROYECTO: shcbozuzwzkzphkmjfwo
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoY2JvenV6d3prenBoa21qZndvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0Nzc4ODQsImV4cCI6MjEwNzA1Mzg4NH0.AyQ4J-EBDohVaF1NzOb90K0okk-zhiMUOsosxInotQc
        run: |
          set -u
          URL="https://${PROYECTO}.supabase.co/rest/v1/rpc/hay_acceso"

          consultar() {
            : > respuesta.txt
            # curl ya imprime 000 si no logra conectarse; no agregar otro codigo
            CODIGO=$(curl -sS -o respuesta.txt -w '%{http_code}' \
              --max-time 30 \
              -X POST "$URL" \
              -H "apikey: ${ANON}" \
              -H "Authorization: Bearer ${ANON}" \
              -H 'Content-Type: application/json' \
              -d '{}' 2>/dev/null) || true
            echo "${CODIGO:-000}"
          }

          # 1) Confirmar que responde, con reintentos por si hay un fallo pasajero
          VIVA=no
          for intento in 1 2 3; do
            CODIGO=$(consultar)
            echo "Comprobacion $intento -> HTTP $CODIGO | $(cat respuesta.txt)"
            if [ "$CODIGO" = "200" ]; then VIVA=si; break; fi
            [ "$intento" -lt 3 ] && sleep 30
          done

          if [ "$VIVA" != "si" ]; then
            echo "::error::La base de datos no respondio (HTTP $CODIGO). Puede estar pausada: entra a supabase.com y pulsa 'Resume project'."
            exit 1
          fi

          # 2) Generar actividad suficiente: varias consultas espaciadas
          OK=1
          for extra in 1 2 3 4; do
            sleep 20
            CODIGO=$(consultar)
            echo "Actividad $extra -> HTTP $CODIGO"
            [ "$CODIGO" = "200" ] && OK=$((OK+1))
          done

          echo "Base de datos activa. $OK consultas correctas en esta corrida."
